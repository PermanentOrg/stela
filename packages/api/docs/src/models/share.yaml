shareSummary:
  description: >
    Share Object Summary
  type: object
  properties:
    id:
      type: string
    accessRole:
      type: string
    status:
      type: string
    archive:
      $ref: "#/shareArchive"
share:
  description: >
    A share granting one archive access to a record or folder that lives in another
  type: object
  properties:
    id:
      type: string
    item:
      $ref: "./item.yaml#/itemSummary"
    accessRole:
      $ref: "./share_access_role.yaml#/shareAccessRole"
    archive:
      $ref: "./archive.yaml#/archiveSummary"
    status:
      type: string
      enum:
        - ok
        - pending
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

pendingShare:
  description: >
    A pending share invitation on an item
  type: object
  properties:
    id:
      type: string
    email:
      type: string
    name:
      type: string
      nullable: true
    accessRole:
      type: string
shareArchive:
  description: >
    Record Share Archive Object
  type: object
  properties:
    id:
      type: string
    thumbUrl200:
      type: string
    name:
      type: string
