tag:
  description: >
    Record Tag Object
  type: object
  properties:
    tagId:
      type: string
    name:
      type: string
    type:
      type: string
record:
  description: >
    Generic Record object
  type: object
  required:
    - id
    - recordId
    - displayName
    - archiveId
    - status
    - uploadFileName
    - uploadAccountId
    - createdAt
    - updatedAt
    - archive
    - accessRole
  properties:
    id:
      type: string
    recordId:
      type: string
      deprecated: true
    displayName:
      type: string
    archiveId:
      type: string
    archiveNumber:
      type: string
    description:
      type: string
    publicAt:
      type: string
    downloadName:
      type: string
    uploadFileName:
      type: string
    uploadAccountId:
      type: string
    uploadPayerAccountId:
      type: string
    size:
      type: number
    displayDate:
      type: string
      format: date-time
    displayTime:
      type: string
      format: edtf
    fileCreatedAt:
      type: string
      format: date-time
    imageRatio:
      type: number
    thumbnailUrls:
      type: object
      properties:
        200:
          type: string
        256:
          type: string
        500:
          type: string
        1000:
          type: string
        2000:
          type: string
    status:
      type: string
    type:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    altText:
      type: string
    location:
      $ref: "../models/location.yaml#/location"
    files:
      type: array
      items:
        $ref: "./archive_file.yaml#/archiveFile"
    folderLinkId:
      type: string
    folderLinkType:
      type: string
    parentFolderId:
      type: string
    parentFolderLinkId:
      type: string
    parentFolderArchiveNumber:
      type: string
    tags:
      type: array
      items:
        $ref: "./record.yaml#/tag"
    archiveArchiveNumber:
      type: string
    shares:
      nullable: true
      type: array
      items:
        $ref: "./share.yaml#/shareSummary"
    pendingShares:
      nullable: true
      type: array
      description: >
        Pending share invitations on this record. Returns an array for users
        with manager or higher access to the record's archive; null otherwise.
      items:
        $ref: "../models/share.yaml#/pendingShare"
    archive:
      type: object
      required:
        - id
        - archiveNumber
      properties:
        id:
          type: string
        archiveNumber:
          type: string
        name:
          type: string
    accessRole:
      description: >
        The caller's effective access role for this record — the most
        permissive role available across all applicable access paths:
        membership in the record's archive, an archive-to-archive share
        targeting the record, a valid share token, or public access to the
        record.
      $ref: "./archive_membership_role.yaml#/archiveMembershipRole"
