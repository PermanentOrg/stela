archives:
  parameters:
    - name: searchQuery
      in: query
      required: false
      description: Filter archives by name matching this search query. At least one of searchQuery or callerMembershipRole is required.
      schema:
        type: string
    - name: callerMembershipRole
      in: query
      required: false
      description: |
        Filter to archives where the authenticated user has one of the specified archive membership roles.
        Can be repeated to filter by multiple roles (OR logic). Requires authentication.
        At least one of searchQuery or callerMembershipRole is required.
      schema:
        type: array
        items:
          $ref: "../models/archive_membership_role.yaml#/archiveMembershipRole"
      style: form
      explode: true
    - name: pageSize
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    - name: cursor
      in: query
      required: false
      schema:
        type: string
  get:
    summary: Search and filter archives
    description: |
      Search for archives by name and/or filter by the authenticated user's archive membership role.

      - Unauthenticated requests return only public archives.
      - Admin-authenticated requests return public archives with owner contact information.
      - User-authenticated requests return public archives and archives of which the caller is a member.

      When filtering by callerMembershipRole:
      - Requires authentication (returns 401 if unauthenticated)
      - Returns only archives where the user has one of the specified roles
      - Includes the user's callerMembershipRole for each returned archive
    security:
      - {}
      - bearerHttpAuthentication: []
    tags:
      - archives
    operationId: get-archives
    responses:
      "200":
        description: A list of archives.
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "../models/archive.yaml#/archive"
      "400":
        $ref: "../errors.yaml#/400"
      "401":
        $ref: "../errors.yaml#/401"
      "500":
        $ref: "../errors.yaml#/500"
  post:
    summary: Create an archive
    security:
      - bearerHttpAuthentication: []
    tags:
      - archives
      - unimplemented
    operationId: post-archives
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              type:
                $ref: "../models/archive_type.yaml#/archiveType"
    responses:
      "200":
        description: The created archive
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../models/archive.yaml#/archive"
      "400":
        $ref: "../errors.yaml#/400"
      "500":
        $ref: "../errors.yaml#/500"
archives-public-search:
  parameters:
    - name: query
      in: query
      required: true
      description: |
        The text to search for. Leading and trailing whitespace is trimmed, and the trimmed
        value must be between 3 and 100 characters long.

        The query is split into words. A field matches a query word when some word in the
        field starts with it, regardless of case; for example, `smi` matches "The Smith
        Family". Record and folder names also match close misspellings of a query word, so
        `harriett` matches "Portrait of Harriet".

        A match needs only one of the query's words. Matches that contain more of the
        query's words are ranked first, and exact matches rank above misspellings; each
        match reports the words it matched in `matchedWords`.

        Words shorter than 3 characters are ignored when the query also contains a longer
        word. Punctuation and search operators in the query have no special meaning. A
        query that contains no words (for example, only punctuation) returns no results.
      schema:
        type: string
        minLength: 3
        maxLength: 100
    - name: pageSize
      in: query
      required: true
      description: The number of archives to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
    - name: cursor
      in: query
      required: false
      description: |
        An opaque cursor from the `pagination.nextCursor` field of a previous response.
        Omit it to request the first page. A malformed cursor is rejected; a cursor that
        does not correspond to a result returns an empty page.
      schema:
        type: string
  get:
    summary: Search public archives
    description: |
      Search public archives for a query string, returning each matching archive along
      with the public content inside it that matched.

      The query is compared against:
      - the archive's name (the `profile.basic` profile item)
      - the title and description of the archive's public profile milestones
      - the names and descriptions of public folders and records in the archive,
        excluding the archive's root folders
      - the names of tags on public folders and records in the archive, and, for
        custom metadata tags (type `type.tag.metadata.<field>`), the `<field>` name

      Archives are ordered by their best match (the most query words matched), then by
      whether their name matched, then by their number of matches.

      Only public, non-deleted archives are searched. Within them, only public,
      non-deleted folders, records, milestones and tags are considered. Private content
      never affects which archives are returned, which matches are returned, or the
      match counts.

      Results are the same for every caller. Authentication and share-token headers
      are ignored.
    security: []
    tags:
      - archives
    operationId: search-public-archives
    responses:
      "200":
        description: A page of matching public archives, ordered by relevance
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - pagination
              properties:
                items:
                  type: array
                  items:
                    $ref: "../models/public_archive_search.yaml#/publicArchiveSearchResult"
                pagination:
                  $ref: "../models/pagination_metadata.yaml#/pagination"
      "400":
        $ref: "../errors.yaml#/400"
      "500":
        $ref: "../errors.yaml#/500"
archives/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    summary: Get an archive
    security:
      - bearerHttpAuthentication: []
    tags:
      - archives
    operationId: get-archives-id
    responses:
      "200":
        description: The requested archive
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../models/archive.yaml#/archive"
      "400":
        $ref: "../errors.yaml#/400"
      "401":
        $ref: "../errors.yaml#/401"
      "404":
        $ref: "../errors.yaml#/404"
      "500":
        $ref: "../errors.yaml#/500"
  patch:
    summary: Update an archive
    security:
      - bearerHttpAuthentication: []
    tags:
      - archives
    operationId: patch-archives
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              milestoneSortOrder:
                type: string
                enum:
                  - chronological
                  - reverse_chronological
    responses:
      "200":
        description: The updated archive
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../models/archive.yaml#/archive"
      "400":
        $ref: "../errors.yaml#/400"
      "500":
        $ref: "../errors.yaml#/500"
archives-id-folders-shared:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: cursor
      description: |
        The id of the folder right before the first folder you want returned.
        In most cases, this will be that of the last folder on the previous page.
      in: query
      required: false
      schema:
        type: string
    - name: pageSize
      in: query
      required: true
      schema:
        type: integer
  get:
    summary: Get all the top-level folders shared by an archive
    security:
      - bearerHttpAuthentication: []
    tags:
      - folders
    operationId: get-archive-shared-folders
    responses:
      "200":
        description: A list of shared folders
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "../models/folder.yaml#/folder"
                pagination:
                  $ref: "../models/pagination_metadata.yaml#/pagination"
      "400":
        $ref: "../errors.yaml#/400"
      "401":
        $ref: "../errors.yaml#/401"
      "403":
        $ref: "../errors.yaml#/403"
      "404":
        $ref: "../errors.yaml#/404"
      "500":
        $ref: "../errors.yaml#/500"
archives/{id}/payer-account-storage:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  get:
    summary: Get the storage of an archive's payer account
    description: >
      Returns the storage allotment and usage of the account that pays for the given archive.
      Returns 404 if the archive has no payer account or if the caller is not an active member
      of that archive.
    security:
      - bearerHttpAuthentication: []
    tags:
      - archives
      - storage
    operationId: get-archive-payer-account-storage
    responses:
      "200":
        description: The storage of the archive's payer account
        content:
          application/json:
            schema:
              $ref: "../models/account_storage.yaml#/accountStorage"
      "400":
        $ref: "../errors.yaml#/400"
      "401":
        $ref: "../errors.yaml#/401"
      "404":
        $ref: "../errors.yaml#/404"
      "500":
        $ref: "../errors.yaml#/500"
archives/{id}/received-shares:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: cursor
      description: |
        The id of the share right before the first share you want returned.
        In most cases, this will be that of the last share on the previous page.
      in: query
      required: false
      schema:
        type: string
    - name: pageSize
      in: query
      required: true
      schema:
        type: integer
  get:
    summary: Get all the shares received by an archive
    security:
      - bearerHttpAuthentication: []
    tags:
      - shares
    operationId: get-archive-received-shares
    responses:
      "200":
        description: A list of shares
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "../models/share.yaml#/share"
                pagination:
                  $ref: "../models/pagination_metadata.yaml#/pagination"
      "400":
        $ref: "../errors.yaml#/400"
      "401":
        $ref: "../errors.yaml#/401"
      "403":
        $ref: "../errors.yaml#/403"
      "404":
        $ref: "../errors.yaml#/404"
      "500":
        $ref: "../errors.yaml#/500"
