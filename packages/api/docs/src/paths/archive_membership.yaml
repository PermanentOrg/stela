archive-memberships/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  patch:
    summary: Update an archive membership
    description: |
      Updateable fields of an archive membership are accessRole and status.
      accessRole can only be updated by a Manager or Owner of the archive involved
      in the membership. status can only be set to "ok", and only by the account involved in
      the membership.
    security:
      - bearerHttpAuthentication: []
    tags:
      - archive-membership
    operationId: patch-archive-membership
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              accessRole:
                type: string
                enum:
                  - viewer
                  - contributor
                  - editor
                  - curator
                  - manager
              status:
                type: string
                enum:
                  - ok
    responses:
      "200":
        description: The updated archive membership
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../models/archive_membership.yaml#/archiveMembership"
      "400":
        $ref: "../errors.yaml#/400"
      "401":
        $ref: "../errors.yaml#/401"
      "403":
        $ref: "../errors.yaml#/403"
      "404":
        $ref: "../errors.yaml#/404"
      "500":
        $ref: "../errors.yaml#/500"
  delete:
    summary: Delete an archive membership
    description: |
      Deletes an archive membership. Archive memberships can be deleted by the account in the membership,
      or by any manager or owner of the archive. Memberships at the owner level cannot be deleted by this endpoint.
    security:
      - bearerHttpAuthentication: []
    tags:
      - archive-membership
    operationId: delete-archive-membership
    responses:
      "204":
        description: The membership has been deleted, nothing is returned
      "400":
        $ref: "../errors.yaml#/400"
      "401":
        $ref: "../errors.yaml#/401"
      "403":
        $ref: "../errors.yaml#/403"
      "404":
        $ref: "../errors.yaml#/404"
      "500":
        $ref: "../errors.yaml#/500"
